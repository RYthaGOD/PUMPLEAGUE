<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PumpLeague Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: 'Inter', sans-serif;
        }

        .card {
            background: #222;
            border: 1px solid #333;
        }

        .btn-danger {
            background: #d32f2f;
        }

        .btn-success {
            background: #2e7d32;
        }

        .status-badge {
            font-size: 0.8em;
            padding: 0.4em 0.8em;
            border-radius: 4px;
        }

        .bg-ok {
            background: #1b5e20;
            color: #a5d6a7;
        }

        .bg-err {
            background: #b71c1c;
            color: #ffcdd2;
        }
    </style>
</head>

<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>🏆 PumpLeague Admin</h3>
            <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">Logout</button>
        </div>

        <div id="loginOverlay"
            class="position-fixed top-0 start-0 w-100 h-100 bg-dark d-flex align-items-center justify-content-center"
            style="z-index: 9999;">
            <div class="card p-4" style="width: 400px;">
                <h4 class="mb-3">Admin Login</h4>
                <div class="mb-3">
                    <label>API Key (Admin Tier)</label>
                    <input type="password" id="apiKeyInput" class="form-control bg-dark text-light border-secondary">
                </div>
                <button id="loginBtn" class="btn btn-primary w-100">Access Dashboard</button>
            </div>
        </div>

        <div class="row">
            <!-- STATUS PANEL -->
            <div class="col-md-4 mb-4">
                <div class="card h-100">
                    <div class="card-header">System Status</div>
                    <div class="card-body">
                        <div class="mb-3 d-flex justify-content-between">
                            <span>API Status:</span>
                            <span id="apiStatus" class="badge bg-secondary">Unknown</span>
                        </div>
                        <div class="mb-3 d-flex justify-content-between">
                            <span>Socket Status:</span>
                            <span id="socketStatus" class="badge bg-secondary">Disconnected</span>
                        </div>
                        <hr>
                        <div class="mb-3">
                            <label class="form-label">Emergency Stop</label>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="emergencyStopToggle">
                                <label class="form-check-label text-danger fw-bold" for="emergencyStopToggle">HALT
                                    PROTOCOL</label>
                            </div>
                            <small class="text-muted">Pauses all payouts immediately.</small>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ROUND INFO -->
            <div class="col-md-8 mb-4">
                <div class="card h-100">
                    <div class="card-header">Current Round</div>
                    <div class="card-body">
                        <div class="row" id="roundStats">
                            <div class="col-6 mb-3">
                                <small class="text-muted">Round ID</small>
                                <div class="fs-5 font-monospace" id="roundId">--</div>
                            </div>
                            <div class="col-6 mb-3">
                                <small class="text-muted">Status</small>
                                <div class="fs-5" id="roundStatus">--</div>
                            </div>
                            <div class="col-6">
                                <small class="text-muted">Tokens Registered</small>
                                <div class="fs-5" id="tokenCount">0</div>
                            </div>
                            <div class="col-6">
                                <small class="text-muted">Time Remaining</small>
                                <div class="fs-5" id="timeRemaining">--</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RECENT LOGS/EVENTS -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Live Event Log</span>
                <span class="badge bg-dark border border-secondary" id="eventCount">0 events</span>
            </div>
            <div class="card-body p-0">
                <div id="eventLog" class="p-3 fs-6 font-monospace"
                    style="height: 300px; overflow-y: auto; background: #000; color: #0f0;">
                    <!-- Logs go here -->
                </div>
            </div>
        </div>
    </div>

    <script src="/admin/app.js"></script>
</body>

</html>
