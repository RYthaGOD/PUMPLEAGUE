<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waitlist Admin - PumpLeague</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            padding: 40px;
            background: #121212;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(30, 30, 30, 0.9);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 40px;
        }

        h1 {
            color: #ffd700;
            font-family: 'Cinzel Decorative', serif;
            margin-bottom: 30px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            color: #ffd700;
            font-weight: 700;
            font-family: 'Cinzel Decorative', serif;
        }

        .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #8b0000 0%, #ff3333 100%);
            border: 2px solid #ffd700;
            border-radius: 6px;
            color: #ffd700;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }

        .filter-btn {
            background: rgba(255, 215, 0, 0.1);
        }

        .filter-btn.active {
            background: rgba(255, 215, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #000;
            color: #ffd700;
            padding: 15px;
            text-align: left;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        tr:hover td {
            background: rgba(255, 215, 0, 0.05);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-builder {
            background: rgba(255, 165, 0, 0.2);
            color: #ffa500;
            border: 1px solid rgba(255, 165, 0, 0.5);
        }

        .badge-trader {
            background: rgba(0, 191, 255, 0.2);
            color: #00bfff;
            border: 1px solid rgba(0, 191, 255, 0.5);
        }

        .copy-btn {
            padding: 4px 8px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 4px;
            color: #ffd700;
            font-size: 11px;
            cursor: pointer;
        }

        .copy-btn:hover {
            background: rgba(255, 215, 0, 0.2);
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <h1>🏛️ Waitlist Admin</h1>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-value" id="total-count">0</div>
                <div class="stat-label">Total Gladiators</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="builder-count">0</div>
                <div class="stat-label">Builders</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="trader-count">0</div>
                <div class="stat-label">Traders</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" onclick="exportCSV()">📥 Export CSV</button>
            <button class="btn filter-btn active" data-filter="all" onclick="filterBy('all')">All</button>
            <button class="btn filter-btn" data-filter="builder" onclick="filterBy('builder')">Builders</button>
            <button class="btn filter-btn" data-filter="trader" onclick="filterBy('trader')">Traders</button>
        </div>

        <table id="waitlist-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Twitter</th>
                    <th>Wallet</th>
                    <th>Email</th>
                    <th>Type</th>
                    <th>Submitted</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="waitlist-body">
                <tr>
                    <td colspan="7" style="text-align: center; padding: 40px;">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        let allEntries = [];
        let currentFilter = 'all';

        async function loadWaitlist() {
            try {
                const response = await fetch('/api/waitlist/all');
                const data = await response.json();
                allEntries = data.entries;

                // Update stats
                document.getElementById('total-count').textContent = data.total;
                document.getElementById('builder-count').textContent = allEntries.filter(e => e.user_type === 'builder').length;
                document.getElementById('trader-count').textContent = allEntries.filter(e => e.user_type === 'trader').length;

                renderTable();
            } catch (error) {
                console.error('Failed to load waitlist:', error);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('waitlist-body');
            const filtered = currentFilter === 'all'
                ? allEntries
                : allEntries.filter(e => e.user_type === currentFilter);

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px;">No entries found</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map((entry, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td>
                        <a href="https://twitter.com/${entry.twitter_handle}" target="_blank" style="color: #ffd700;">
                            @${entry.twitter_handle}
                        </a>
                    </td>
                    <td>
                        <code style="font-size: 11px;">${entry.wallet_address.slice(0, 8)}...${entry.wallet_address.slice(-6)}</code>
                        <button class="copy-btn" onclick="copyToClipboard('${entry.wallet_address}')">Copy</button>
                    </td>
                    <td>${entry.email || '<span style="color: #666;">-</span>'}</td>
                    <td>
                        <span class="badge badge-${entry.user_type}">${entry.user_type}</span>
                    </td>
                    <td>${new Date(entry.submitted_at).toLocaleDateString()}</td>
                    <td>
                        <button class="copy-btn" onclick="copyContact('${entry.twitter_handle}', '${entry.email || ''}')">
                            Copy Contact
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function filterBy(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === type);
            });
            renderTable();
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert('Copied to clipboard!');
        }

        function copyContact(twitter, email) {
            const contact = `Twitter: @${twitter}${email ? `\nEmail: ${email}` : ''}`;
            navigator.clipboard.writeText(contact);
            alert('Contact info copied!');
        }

        function exportCSV() {
            const filtered = currentFilter === 'all'
                ? allEntries
                : allEntries.filter(e => e.user_type === currentFilter);

            const headers = ['Position', 'Twitter Handle', 'Wallet Address', 'Email', 'User Type', 'Submitted Date'];
            const rows = filtered.map((entry, index) => [
                index + 1,
                entry.twitter_handle,
                entry.wallet_address,
                entry.email || '',
                entry.user_type,
                new Date(entry.submitted_at).toISOString()
            ]);

            const csv = [
                headers.join(','),
                ...rows.map(row => row.map(cell => `"${cell}"`).join(','))
            ].join('\n');

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `pumpleague-waitlist-${currentFilter}-${Date.now()}.csv`;
            a.click();
        }

        // Load on page load
        loadWaitlist();

        // Refresh every 30 seconds
        setInterval(loadWaitlist, 30000);
    </script>
</body>

</html>
